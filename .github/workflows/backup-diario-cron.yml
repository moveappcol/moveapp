name: Backup diario de Airtable

on:
  schedule:
    - cron: "0 13 * * *" # 8am America/Bogota (UTC-5)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backup-diario cron
        run: |
          curl -sf -X GET "https://www.uniqueappcol.com/api/cron/backup-diario" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
