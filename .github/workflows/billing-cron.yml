name: Wompi subscription billing

# El disparo automático vive en el servicio cron-billing de Railway (8am
# Bogotá). Este workflow queda solo como respaldo manual: si los dos
# corrieran a la vez podrían cobrarle dos veces a la misma suscripción.
on:
  workflow_dispatch: {}

jobs:
  bill:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger billing cron
        run: |
          curl -sf --max-time 60 --retry 2 --retry-delay 10 --retry-max-time 180 -X GET "https://www.uniqueappcol.com/api/cron/billing" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
