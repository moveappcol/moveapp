# El disparo automático vive normalmente en el servicio cron-despues-clase
# en Railway. REACTIVADO TEMPORAL el 21 de octubre de 2026: Railway tuvo
# una caída grande (dashboard, API y builds abajo) y sus Cron Jobs dejaron
# de correr — mientras se resuelve, este horario de respaldo evita que se
# deje de avisar a la gente. Quitar el `schedule:` de acá (dejando solo
# workflow_dispatch) en cuanto Railway confirme que sus crones volvieron.
name: Correo after class

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger despues-clase cron
        run: |
          curl -sf --max-time 60 --retry 2 --retry-delay 10 --retry-max-time 180 -X GET "https://www.uniqueappcol.com/api/cron/despues-clase" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
