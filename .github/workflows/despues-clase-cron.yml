# El disparo automático vive normalmente en el servicio cron-despues-clase
# en Railway. Este workflow queda solo como respaldo manual
# (workflow_dispatch) para disparar el cron a mano si hace falta.
name: Correo after class

on:
  workflow_dispatch: {}

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger despues-clase cron
        run: |
          curl -sf --max-time 60 --retry 2 --retry-delay 10 --retry-max-time 180 -X GET "https://www.uniqueappcol.com/api/cron/despues-clase" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
