# El disparo automático vive normalmente en el servicio cron-liquidaciones
# en Railway. REACTIVADO TEMPORAL el 21 de octubre de 2026: Railway tuvo
# una caída grande (dashboard, API y builds abajo) y sus Cron Jobs dejaron
# de correr — mientras se resuelve, este horario de respaldo evita que se
# atrase el aviso de liquidación. Quitar el `schedule:` de acá (dejando
# solo workflow_dispatch) en cuanto Railway confirme que sus crones
# volvieron.
name: Liquidaciones a gimnasios

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

jobs:
  liquidar:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger liquidaciones cron
        run: |
          curl -sf --max-time 60 --retry 2 --retry-delay 10 --retry-max-time 180 -X GET "https://www.uniqueappcol.com/api/cron/liquidaciones" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
