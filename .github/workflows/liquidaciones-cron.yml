# El disparo automático (cada 5 min) se movió al servicio
# cron-liquidaciones en Railway — GitHub Actions no garantiza esa cadencia
# en repos de bajo tráfico, y corriendo solo cada 4 horas el correo de 24h
# antes podía salir con horas de diferencia. Este workflow queda solo como
# respaldo manual (workflow_dispatch).
name: Liquidaciones a gimnasios

on:
  workflow_dispatch: {}

jobs:
  liquidar:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger liquidaciones cron
        run: |
          curl -sf --max-time 60 --retry 2 --retry-delay 10 --retry-max-time 180 -X GET "https://www.uniqueappcol.com/api/cron/liquidaciones" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
