# El disparo automático vive normalmente en el servicio
# cron-promover-lista-espera en Railway (nunca tuvo respaldo en GitHub
# Actions hasta ahora). REACTIVADO TEMPORAL el 21 de octubre de 2026:
# Railway tuvo una caída grande (dashboard, API y builds abajo) y sus Cron
# Jobs dejaron de correr — mientras se resuelve, este horario evita que se
# quede alguien esperando un cupo que ya se liberó. Quitar el `schedule:`
# de acá (dejando solo workflow_dispatch) en cuanto Railway confirme que
# sus crones volvieron.
name: Promover lista de espera

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

jobs:
  promover:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger promover-lista-espera cron
        run: |
          curl -sf --max-time 60 --retry 2 --retry-delay 10 --retry-max-time 180 -X GET "https://www.uniqueappcol.com/api/cron/promover-lista-espera" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
