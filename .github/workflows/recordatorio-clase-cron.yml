# El disparo automático vive normalmente en el servicio
# cron-recordatorio-clase en Railway. Este workflow queda solo como
# respaldo manual (workflow_dispatch) para disparar el cron a mano si
# hace falta.
name: Recordatorio de clase 3h antes

on:
  workflow_dispatch: {}

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger recordatorio-clase cron
        run: |
          curl -sf --max-time 60 --retry 2 --retry-delay 10 --retry-max-time 180 -X GET "https://www.uniqueappcol.com/api/cron/recordatorio-clase" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
