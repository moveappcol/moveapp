# El disparo automático vive normalmente en el servicio
# cron-recordatorio-clase en Railway. REACTIVADO TEMPORAL el 21 de octubre
# de 2026: Railway tuvo una caída grande (dashboard, API y builds abajo) y
# sus Cron Jobs dejaron de correr — mientras se resuelve, este horario de
# respaldo evita que se deje de avisar a la gente antes de su clase.
# Quitar el `schedule:` de acá (dejando solo workflow_dispatch) en cuanto
# Railway confirme que sus crones volvieron.
name: Recordatorio de clase 3h antes

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger recordatorio-clase cron
        run: |
          curl -sf --max-time 60 --retry 2 --retry-delay 10 --retry-max-time 180 -X GET "https://www.uniqueappcol.com/api/cron/recordatorio-clase" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
